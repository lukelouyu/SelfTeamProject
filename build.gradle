plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.10.0'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.10.0'
}

test {
    useJUnitPlatform()
    enableAssertions = true

    testLogging {
        events "passed", "skipped", "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
        showStandardStreams = false
    }
}

application {
    mainClass.set("seedu.unienable.UniEnable")
}

shadowJar {
    archiveBaseName.set("unienable")
    archiveClassifier.set("")
    // academic-calendar.txt is duplicated into src/main/resources so it's available as a
    // source-tree artifact, but it must still stay out of the built jar (see the comment on
    // releaseZip below) - only the copy under data/ is ever read at runtime.
    exclude 'academic-calendar.txt'
}

checkstyle {
    toolVersion = '10.2'
}

tasks.withType(Javadoc).configureEach {
    // The course standard permits omitted tags when names/returns are self-explanatory. Suppress
    // only doclint's blanket "missing" category; malformed HTML/references and every other
    // doclint warning remain fatal in CI.
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addBooleanOption('Werror', true)
}

// The editable academic calendar must remain outside the JAR (see recur's external-calendar
// requirement). CS2113 permits packaging the release as a single portable ZIP when an
// application needs an external editable file, so this task produces that complete distribution
// while keeping the calendar replaceable for a future academic year without recompiling.
tasks.register('releaseZip', Zip) {
    dependsOn shadowJar
    archiveFileName.set("unienable.zip")
    destinationDirectory.set(layout.buildDirectory.dir("distributions"))
    from(shadowJar.archiveFile) {
        rename { "unienable.jar" }
    }
    from("data/academic-calendar.txt") {
        into "data"
    }
}

// Verifies the final user-facing distribution rather than only the build-tree JAR. The smoke
// test runs from the extracted directory, proving that the external editable calendar is placed
// where the documented application layout expects it.
tasks.register('verifyReleaseZip') {
    dependsOn releaseZip
    doLast {
        def archive = layout.buildDirectory.file('distributions/unienable.zip').get().asFile
        def extractionDirectory = layout.buildDirectory.dir('release-smoke').get().asFile
        delete extractionDirectory
        copy {
            from zipTree(archive)
            into extractionDirectory
        }

        def releaseJar = new File(extractionDirectory, 'unienable.jar')
        def releaseCalendar = new File(extractionDirectory, 'data/academic-calendar.txt')
        if (!releaseJar.isFile() || !releaseCalendar.isFile()) {
            throw new GradleException('Release ZIP is missing unienable.jar or data/academic-calendar.txt')
        }

        def javaExecutableName = System.getProperty('os.name').toLowerCase().contains('windows')
                ? 'java.exe' : 'java'
        def javaExecutable = new File(System.getProperty('java.home'), 'bin/' + javaExecutableName)
        def smokeOutput = new ByteArrayOutputStream()
        def smokeResult = exec {
            workingDir extractionDirectory
            commandLine javaExecutable.absolutePath, '-jar', releaseJar.absolutePath
            standardInput = new ByteArrayInputStream('bye\n'.getBytes('UTF-8'))
            standardOutput = smokeOutput
            errorOutput = smokeOutput
            ignoreExitValue = true
        }
        if (smokeResult.exitValue != 0 || !smokeOutput.toString('UTF-8').contains('Bye!')) {
            throw new GradleException('Extracted release ZIP smoke test failed:\n'
                    + smokeOutput.toString('UTF-8'))
        }
    }
}

run {
    standardInput = System.in
    enableAssertions = true
}

// `run` and `test` enable programmer-only lifecycle assertions. Required domain validation uses
// explicit checks, so the documented `java -jar unienable.jar` release command is equally safe.
