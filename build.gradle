plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.10.0'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.10.0'
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
        showStandardStreams = false
    }
}

application {
    mainClass.set("seedu.unienable.UniEnable")
}

shadowJar {
    archiveBaseName.set("unienable")
    archiveClassifier.set("")
    // academic-calendar.txt is duplicated into src/main/resources so it's available as a
    // source-tree artifact, but it must still stay out of the built jar (see the comment on
    // releaseZip below) - only the copy under data/ is ever read at runtime.
    exclude 'academic-calendar.txt'
}

checkstyle {
    toolVersion = '10.2'
}

// The editable academic calendar must remain outside the JAR (see recur's external-calendar
// requirement). CS2113 permits packaging the release as a single portable ZIP when an
// application needs an external editable file, so this task produces that complete distribution
// while keeping the calendar replaceable for a future academic year without recompiling.
tasks.register('releaseZip', Zip) {
    dependsOn shadowJar
    archiveFileName.set("unienable.zip")
    destinationDirectory.set(layout.buildDirectory.dir("distributions"))
    from(shadowJar.archiveFile) {
        rename { "unienable.jar" }
    }
    from("data/academic-calendar.txt") {
        into "data"
    }
}

run {
    standardInput = System.in
}
